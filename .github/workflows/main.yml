name: Deploy from commit

on:
  workflow_dispatch:
    inputs:
      commit:
        description: bda189e00c52520f212409d4d44026cccacd33e9
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - run: ./deploy.sh
